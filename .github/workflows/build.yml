name: Build NootedGreen (T14G4 sleep)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (XPS13Plus stack build script)
        run: |
          zsh build-nootedgreen.sh
          ls -l build/NootedGreen.kext/Contents/MacOS
      - name: Commit binaries back
        run: |
          mkdir -p out && rm -rf out/*
          cp -R build/NootedGreen.kext out/
          strings -a out/NootedGreen.kext/Contents/MacOS/NootedGreen | grep -c "XE-FWSNAP"
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -f out && git commit -m "Built kext [skip ci]" && git push
